# Staging test rig for the "DuckDB for Activity Logs" architecture:
#   MySQL (hot) -> outbox -> Redis queue -> archive worker -> Parquet -> MinIO -> DuckDB
#
# Everything shares one network (${PREFIX}-net) and one container prefix (${PREFIX}-).
name: ${PREFIX}

x-analytics-common: &analytics-common
  build:
    context: ./analytics
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE}
  image: ${PREFIX}/analytics:local
  env_file: .env
  environment:
    MYSQL_HOST: ${PREFIX}-mysql
    REDIS_HOST: ${PREFIX}-redis
    S3_ENDPOINT: ${PREFIX}-minio:9000
  volumes:
    - analytics-work:/var/lib/analytics
  networks: [net]
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- hot store
  mysql:
    image: ${MYSQL_IMAGE}
    container_name: ${PREFIX}-mysql
    command: --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${BIND_ADDR}:${MYSQL_PORT}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [net]
    restart: unless-stopped

  # -------------------------------------------------------------------- queue
  redis:
    image: ${REDIS_IMAGE}
    container_name: ${PREFIX}-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    ports:
      - "${BIND_ADDR}:${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [net]
    restart: unless-stopped

  # ----------------------------------------------------------- object storage
  minio:
    image: ${MINIO_IMAGE}
    container_name: ${PREFIX}-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SITE_REGION: ${MINIO_REGION}
    volumes:
      - minio-data:/data
    ports:
      - "${BIND_ADDR}:${MINIO_API_PORT}:9000"
      - "${BIND_ADDR}:${MINIO_CONSOLE_PORT}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [net]
    restart: unless-stopped

  # Creates the private, versioned bucket, then exits. The pipeline uses the
  # root credentials here; on a real deployment issue separate writer/reader keys.
  minio-init:
    image: ${MC_IMAGE}
    container_name: ${PREFIX}-minio-init
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_ALIAS_URL: http://${PREFIX}-minio:9000
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./minio/init.sh:/init.sh:ro
    networks: [net]
    restart: "no"

  # -------------------------------------------------- archive pipeline (DuckDB)
  # Long-running BLPOP consumer: MySQL batch -> Parquet -> checksum -> MinIO -> manifest.
  worker:
    <<: *analytics-common
    container_name: ${PREFIX}-worker
    command: ["python", "-m", "app.archive"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  # Sweeps the outbox and enqueues one archive job per pending (year, month).
  dispatcher:
    <<: *analytics-common
    container_name: ${PREFIX}-dispatcher
    command: ["python", "-m", "app.dispatcher"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}

  # ------------------------------------------------------- on-demand tooling
  # Interactive DuckDB shell wired to MinIO:  docker compose run --rm duckdb
  duckdb:
    <<: *analytics-common
    container_name: ${PREFIX}-duckdb
    profiles: [cli]
    restart: "no"
    stdin_open: true
    tty: true
    command: ["python", "-m", "app.shell"]

  adminer:
    image: ${ADMINER_IMAGE}
    container_name: ${PREFIX}-adminer
    profiles: [tools]
    environment:
      ADMINER_DEFAULT_SERVER: ${PREFIX}-mysql
    ports:
      - "${BIND_ADDR}:${ADMINER_PORT}:8080"
    depends_on:
      mysql: {condition: service_healthy}
    networks: [net]
    restart: unless-stopped

networks:
  net:
    name: ${PREFIX}-net
    driver: bridge

volumes:
  mysql-data:
    name: ${PREFIX}-mysql-data
  redis-data:
    name: ${PREFIX}-redis-data
  minio-data:
    name: ${PREFIX}-minio-data
  analytics-work:
    name: ${PREFIX}-analytics-work
